[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmread"
version = "0.0.1"
description = "Read-only access to RootsMagic SQLite databases."
requires-python = ">=3.12"
# Standard library only — sqlite3, dataclasses, argparse.
dependencies = []

[project.scripts]
rm-find = "rmread.cli.find:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
